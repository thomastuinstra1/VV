<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Gereedschapspunt</title>
  <link rel="stylesheet" href="css/contact.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="/images/favicon.png">
</head>
<body>

  <header class="site-header">
    <div class="container nav-container">
      <div class="logo">
        <a href="index.html">
          <img src="./images/Logo.png" alt="Gereedschapspunt" class="logo-img" />
        </a>
      </div>

      <form class="header-search" action="zoeken.html" method="get">
        <input type="text" name="search" placeholder="Zoek gereedschap of profielen..." aria-label="Zoek gereedschap of profielen" />
        <button type="submit">Zoeken</button>
      </form>

      <button class="hamburger" id="hamburger" aria-label="Menu openen" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav class="main-nav" id="mainNav">
        <form class="header-search mobile-search" action="zoeken.html" method="get">
          <input type="text" name="search" placeholder="Zoek gereedschap..." aria-label="Zoek gereedschap" />
          <button type="submit">Zoeken</button>
        </form>

        <ul>
          <li data-auth="true"><a href="lenerdashboard.html">Lenerdashboard</a></li>
          <li data-auth="true"><a href="uitlenerdashboard.html">Uitlenerdashboard</a></li>
          <li data-auth="true">
            <a href="mijnchats.html" style="position:relative;">
              Berichten
              <span id="navUnreadBadge" style="display:none;"></span>
            </a>
          </li>
          <li data-auth="true">
            <a href="accountinstellingen.html">
              <div id="navAvatar"><span id="navAvatarInitials">?</span></div>
            </a>
          </li>
          <li data-guest="true"><a href="inlog.html">Inloggen</a></li>
          <li data-guest="true"><a href="register.html">Registreren</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="contact-page">
    <div class="container">
      <h1>Contact</h1>
      <p class="contact-sub">Heb je een vraag of opmerking? Stuur ons een bericht.</p>

      <form class="contact-form" id="contactForm">
        <div class="form-group">
          <label for="name">Naam</label>
          <input type="text" id="name" name="name" required />
        </div>

        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" required />
        </div>

        <div class="form-group">
      <label for="subject">Onderwerp</label>
      <input type="text" id="subject" name="subject" required />
      </div>

        <div class="form-group">
          <label for="message">Bericht</label>
          <textarea id="message" name="message" rows="5" required></textarea>
        </div>

        <button type="submit">Verstuur bericht</button>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-container">
      <div class="footer-brand">
        <h3>Gereedschapspunt</h3>
        <p>Leen slim, lokaal en duurzaam.</p>
      </div>
      <ul class="footer-links">
        <li><a href="#">Over ons</a></li>
        <li><a href="#">Contact</a></li>
        <li><a href="#">Privacy</a></li>
      </ul>
    </div>
    <div class="footer-bottom">
      <p>&copy; 2026 Gereedschapspunt</p>
    </div>
  </footer>

  <div id="toast"></div>

  <script src="js/globaal.js"></script>
  <script src="js/logincheck.js"></script>
  <script>
document.getElementById("contactForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const data = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        subject: document.getElementById("subject").value,
        message: document.getElementById("message").value
    };

    try {
        const response = await fetch("/api/create-ticket", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
        });

        const result = await response.json();

        if (result.success) {
            alert("Ticket aangemaakt! Ticket #" + result.ticket_id);
            this.reset();
        } else {
            alert(result.message);
        }
    } catch (err) {
        alert("Er ging iets mis.");
    }
});
</script>
</body>
</html>
